services:
  - type: web
    name: dexcom-job-tracker
    runtime: docker
    plan: starter
    healthCheckPath: /api/status
    envVars:
      - key: BROWSER_HEADLESS
        value: "true"
      - key: CHROME_BINARY
        value: /usr/bin/chromium
      - key: OUTPUT_FILE
        value: /data/Dexcom_Job_Tracker.xlsx
    disk:
      name: tracker-data
      mountPath: /data
      sizeGB: 1
